services:
  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/app.db
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app-data:
